<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">fdu-doctorplan · 博士科研计划书</title>
  <desc id="desc">复旦大学博士科研计划书模板。封面信息由 fdpsetup 设置，正文依次组织立题依据、研究内容、研究方法和考核指标。</desc>
